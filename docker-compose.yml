version: "3.8"

services:
  server-a:
    build: ./server-a
    ports:
      - "3000:3000"
    volumes:
      - ./server-a/animals.json:/app/animals.json
    networks:
      - animal-net

  server-b:
    build: ./server-b
    ports:
      - "4000:4000"
    volumes:
      - ./server-b/adoptions.json:/app/adoptions.json
    networks:
      - animal-net


  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    networks:
      - animal-net

networks:
  animal-net:
